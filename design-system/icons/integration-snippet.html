<div class="cat-grid" id="cat-grid" role="group" aria-label="Select a category">

      <button class="cat-card" data-cat="plumbing" onclick="selectCategory('plumbing')">

      </button>
      <button class="cat-card" data-cat="electrical" onclick="selectCategory('electrical')">
        <svg class="cat-icon" width="28" height="28" viewBox="0 0 24 24"><use href="/icons/icons.svg#icon-electrical"/></svg>
        <span class="cat-label">Electrical</span>
      </button>
      <button class="cat-card" data-cat="tutoring" onclick="selectCategory('tutoring')">
        <svg class="cat-icon" width="28" height="28" viewBox="0 0 24 24"><use href="/icons/icons.svg#icon-tutoring"/></svg>

      </button>
      <button class="cat-card" data-cat="moving" onclick="selectCategory('moving')">

      </button>

      </button>

<!-- 3. Styles -->
<style>
.cat-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--sp-3, 12px);
  margin: var(--sp-4, 16px) 0;
}
@media (max-width: 480px) { .cat-grid { grid-template-columns: repeat(2, 1fr); } }
.cat-card {
  display: flex; flex-direction: column; align-items: center;
  gap: var(--sp-2, 8px); padding: var(--sp-3, 12px) var(--sp-2, 8px);
  background: var(--bg-2); border: 1.5px solid var(--border);
  border-radius: var(--r, 10px); cursor: pointer;
  transition: all 150ms cubic-bezier(0.4,0,0.2,1);
  color: var(--text-2); font-family: var(--font, inherit);
}
.cat-card:hover, .cat-card.selected {
  border-color: #D97706; background: var(--gold-soft);
  color: #D97706; transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(217,119,6,0.18);
}
.cat-icon { color: inherit; transition: transform 150ms ease; }
.cat-card:hover .cat-icon, .cat-card.selected .cat-icon { transform: scale(1.12); }
.cat-label { font-size: 0.75rem; font-weight: 600; text-align: center; }
</style>

<!-- 4. Selection JS -->
<script>
function selectCategory(id) {
  document.querySelectorAll(".cat-card").forEach(el => el.classList.remove("selected"));
  const card = document.querySelector(`.cat-card[data-cat="${id}"]`);
  if (card) card.classList.add("selected");
  const sel = document.getElementById("tc5");
  if (sel) sel.value = id;
}
</script>
