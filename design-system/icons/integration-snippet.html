<!-- 3. Styles — add to shared.css or inline -->
<style>
/* ── Category grid ───────────────────────────────────────── */
.cat-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--sp-3, 12px);
  margin: var(--sp-4, 16px) 0;
}
@media (max-width: 480px) {
  .cat-grid { grid-template-columns: repeat(2, 1fr); }
}

.cat-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sp-2, 8px);
  padding: var(--sp-3, 12px) var(--sp-2, 8px);
  background: var(--bg-2, #F8FAFC);
  border: 1.5px solid var(--border, #E2E8F0);
  border-radius: var(--r, 10px);
  cursor: pointer;
  transition: all 150ms cubic-bezier(0.4,0,0.2,1);
  font-family: var(--font, inherit);
  color: var(--text-2, #475569);
}

.cat-card:hover {
  border-color: #D97706;
  color: var(--text, #0F172A);
  background: var(--gold-soft, rgba(217,119,6,0.06));
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(217,119,6,0.15);
}

.cat-card.selected {
  border-color: #D97706;
  background: var(--gold-soft, rgba(217,119,6,0.08));
  color: #D97706;
}

/* Dark background override */
.dark .cat-card,
[data-theme="dark"] .cat-card {
  background: rgba(255,255,255,0.05);
  border-color: rgba(255,255,255,0.12);
  color: rgba(255,255,255,0.7);
}

.cat-icon {
  color: inherit;
  flex-shrink: 0;
  transition: transform 150ms ease;
}
.cat-card:hover .cat-icon,
.cat-card.selected .cat-icon {
  transform: scale(1.1);
  color: #D97706;
}

.cat-label {
  font-size: 0.75rem;
  font-weight: 600;
  text-align: center;
  line-height: 1.2;
}
</style>

<!-- 4. Selection JS -->
<script>
function selectCategory(id) {
  document.querySelectorAll('.cat-card').forEach(el => el.classList.remove('selected'));
  const card = document.querySelector(`.cat-card[data-cat="${id}"]`);
  if (card) card.classList.add('selected');
  // Also update hidden input / select if present
  const sel = document.getElementById('tc5');
  if (sel) sel.value = id;
}
</script>
