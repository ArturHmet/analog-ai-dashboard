<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">

  <symbol id="icon-cleaning" viewBox="0 0 24 32">

  <!-- Spray bottle body -->
  <rect x="7" y="11" width="11" height="17" rx="2" fill="currentColor"/>
  <!-- Neck -->
  <rect x="9" y="7" width="5" height="5" rx="1" fill="currentColor"/>
  <!-- Trigger arm -->
  <path d="M14 10 L19 10 L19 15 L14 15" fill="currentColor" rx="1"/>
  <!-- Nozzle -->
  <rect x="18" y="9" width="4" height="2.5" rx="1.2" fill="#D97706"/>
  <!-- Spray droplets -->
  <circle cx="23" cy="7.5" r="1" fill="#D97706"/>
  <circle cx="23.5" cy="10" r="0.8" fill="#D97706"/>
  <circle cx="23.2" cy="12.3" r="0.6" fill="#D97706"/>
  <!-- Label stripe -->
  <rect x="8" y="19" width="9" height="2.5" rx="1.2" fill="#D97706"/>
  </symbol>

  <symbol id="icon-plumbing" viewBox="0 0 24 32">

  <!-- Pipe horizontal -->
  <rect x="1" y="13" width="14" height="5" rx="2.5" fill="currentColor"/>
  <!-- Pipe vertical -->
  <rect x="11" y="5" width="5" height="12" rx="2.5" fill="currentColor"/>
  <!-- Cap top -->
  <rect x="9" y="3" width="9" height="4" rx="2" fill="currentColor"/>
  <!-- Drip drop -->
  <path d="M4 18 C4 18 2.5 21.5 2.5 23.5 C2.5 25.4 3.1 27 4 27 C4.9 27 5.5 25.4 5.5 23.5 C5.5 21.5 4 18 4 18Z" fill="#D97706"/>
  <!-- Pipe end flange left -->
  <rect x="0" y="12" width="3" height="7" rx="1.5" fill="#D97706"/>
  </symbol>

  <symbol id="icon-electrical" viewBox="0 0 24 32">

  <!-- Lightning bolt outer -->
  <path d="M15 2 L6 18 L12 18 L9 30 L18 13 L12.5 13 Z" fill="currentColor"/>
  <!-- Lightning bolt inner glow -->
  <path d="M14 5.5 L7.5 17 L12.5 17 L10.5 26.5 L16 14.5 L11 14.5 Z" fill="#D97706"/>
  </symbol>

  <symbol id="icon-tutoring" viewBox="0 0 24 32">

  <!-- Mortarboard base (brim) -->
  <ellipse cx="12" cy="12" rx="10" ry="2.5" fill="currentColor"/>
  <!-- Cap top -->
  <rect x="5" y="7" width="14" height="6" rx="2" fill="currentColor"/>
  <!-- Top flat part -->
  <rect x="4" y="5" width="16" height="3" rx="1" fill="currentColor"/>
  <!-- Tassel string -->
  <line x1="20" y1="12" x2="20" y2="20" stroke="#D97706" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Tassel end -->
  <circle cx="20" cy="21" r="2" fill="#D97706"/>
  <!-- Diploma roll below -->
  <rect x="6" y="20" width="12" height="9" rx="2" fill="currentColor"/>
  <!-- Ribbon band -->
  <rect x="6" y="23.5" width="12" height="2.5" rx="0" fill="#D97706"/>
  <!-- Roll end caps -->
  <ellipse cx="6" cy="24.5" rx="1.5" ry="4.5" fill="currentColor"/>
  <ellipse cx="18" cy="24.5" rx="1.5" ry="4.5" fill="currentColor"/>
  </symbol>

  <symbol id="icon-moving" viewBox="0 0 24 32">

  <!-- Box body -->
  <rect x="2" y="14" width="20" height="15" rx="2" fill="currentColor"/>
  <!-- Left flap -->
  <path d="M2 14 L2 8 L12 10 L12 14 Z" fill="currentColor"/>
  <!-- Right flap -->
  <path d="M22 14 L22 8 L12 10 L12 14 Z" fill="currentColor"/>
  <!-- Tape strip vertical -->
  <rect x="10.5" y="10" width="3" height="19" rx="0" fill="#D97706"/>
  <!-- Tape strip horizontal -->
  <rect x="2" y="20" width="20" height="2.5" rx="0" fill="#D97706"/>
  <!-- Left arrow (moving) -->
  <path d="M5 5 L2 7.5 L5 10" stroke="#D97706" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="2" y1="7.5" x2="9" y2="7.5" stroke="#D97706" stroke-width="1.5" stroke-linecap="round"/>
  </symbol>

  <symbol id="icon-beauty" viewBox="0 0 24 32">

  <!-- Scissors ring left -->
  <circle cx="7" cy="7" r="4.5" fill="currentColor"/>
  <circle cx="7" cy="7" r="2.5" fill="#D97706"/>
  <circle cx="7" cy="7" r="1.2" fill="currentColor"/>
  <!-- Scissors ring right -->
  <circle cx="17" cy="7" r="4.5" fill="currentColor"/>
  <circle cx="17" cy="7" r="2.5" fill="#D97706"/>
  <circle cx="17" cy="7" r="1.2" fill="currentColor"/>
  <!-- Blade 1: from left ring down-right to tip -->
  <path d="M9.5 9.5 L16 21" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <!-- Blade 2: from right ring down-left to tip -->
  <path d="M14.5 9.5 L8 21" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <!-- Pivot point -->
  <circle cx="12" cy="15" r="2" fill="#D97706"/>
  <!-- Blade lower halves (handles) -->
  <path d="M16 21 L14 30 L10 30 L8 21 L12 23 Z" fill="currentColor"/>
  </symbol>

  <symbol id="icon-repairs" viewBox="0 0 24 32">

  <!-- Hammer head -->
  <rect x="7" y="3" width="14" height="8" rx="2.5" fill="currentColor"/>
  <!-- Claw notch -->
  <path d="M7 5 L3 3.5 M7 9 L3 10.5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Strike face accent -->
  <rect x="17" y="3" width="4" height="8" rx="0 2.5 2.5 0" fill="#D97706"/>
  <!-- Handle -->
  <rect x="12" y="10" width="4" height="20" rx="2" fill="currentColor"/>
  <!-- Grip wrap bottom -->
  <rect x="11.5" y="22" width="5" height="6" rx="2" fill="#D97706"/>
  <!-- Grip lines -->
  <line x1="11.5" y1="24" x2="16.5" y2="24" stroke="currentColor" stroke-width="0.8" opacity="0.5"/>
  <line x1="11.5" y1="26" x2="16.5" y2="26" stroke="currentColor" stroke-width="0.8" opacity="0.5"/>
  </symbol>

  <symbol id="icon-gardening" viewBox="0 0 24 32">

  <!-- Leaf shape -->
  <path d="M12 2 C18 4 22 10 22 17 C22 23 18 28 12 30 C6 28 2 23 2 17 C2 10 6 4 12 2 Z" fill="currentColor"/>
  <!-- Stem -->
  <line x1="12" y1="30" x2="12" y2="26" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>
  <!-- Center vein -->
  <line x1="12" y1="5" x2="12" y2="28" stroke="#D97706" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Side veins left -->
  <path d="M12 11 Q8 13 5 15" stroke="#D97706" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M12 16 Q7 18 5 21" stroke="#D97706" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M12 21 Q8 23 7 26" stroke="#D97706" stroke-width="1" fill="none" stroke-linecap="round"/>
  <!-- Side veins right -->
  <path d="M12 11 Q16 13 19 15" stroke="#D97706" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M12 16 Q17 18 19 21" stroke="#D97706" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M12 21 Q16 23 17 26" stroke="#D97706" stroke-width="1" fill="none" stroke-linecap="round"/>
  </symbol>

</svg>