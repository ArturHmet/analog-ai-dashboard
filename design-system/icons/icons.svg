<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="icon-cleaning" viewBox="0 0 24 24">

  <!-- Spray bottle body -->
  <rect x="7" y="8" width="10" height="13" rx="2" fill="currentColor"/>
  <!-- Neck -->
  <rect x="9" y="5" width="4" height="4" rx="1" fill="currentColor"/>
  <!-- Trigger -->
  <path d="M13 6.5 L18 6.5 L18 10.5 L13 10.5" fill="currentColor"/>
  <!-- Nozzle tip -->
  <rect x="17.5" y="6" width="4.5" height="2" rx="1" fill="#D97706"/>
  <!-- Spray droplets -->
  <circle cx="22" cy="5" r="0.9" fill="#D97706"/>
  <circle cx="23" cy="7.5" r="0.7" fill="#D97706"/>
  <circle cx="22.5" cy="10" r="0.5" fill="#D97706"/>
  <!-- Label stripe -->
  <rect x="8" y="14" width="8" height="2" rx="1" fill="#D97706"/>
  </symbol>

  <symbol id="icon-plumbing" viewBox="0 0 24 24">

  <!-- Wrench body -->
  <path d="M3 20 L13 8" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- Wrench open head C-shape top -->
  <path d="M12 7 C12 4 15 3 17.5 4.5 C15.5 4.5 14 6 14 8 C14 10 15.5 11.5 17.5 11.5 C15 13 12 12 12 9 Z" fill="currentColor"/>
  <!-- Head solid block -->
  <path d="M13 7.5 L19 5 L21 9 L15 12 Z" fill="currentColor"/>
  <!-- Pipe drop accent -->
  <path d="M5 19 C5 19 3.5 22 3.5 23.5 C3.5 24.9 4.1 26 5 26 C5.9 26 6.5 24.9 6.5 23.5 C6.5 22 5 19 5 19Z" fill="#D97706"/>
  </symbol>

  <symbol id="icon-electrical" viewBox="0 0 24 24">

  <!-- Lightning bolt outer -->
  <path d="M14 1 L5 14 L11 14 L10 23 L19 10 L13 10 Z" fill="currentColor"/>
  <!-- Lightning bolt gold inner -->
  <path d="M13 4 L6.5 13 L12 13 L11 21 L17 11 L12 11 Z" fill="#D97706"/>
  </symbol>

  <symbol id="icon-tutoring" viewBox="0 0 24 24">

  <!-- Open book left page -->
  <path d="M12 5 C10 4 7 4 4 5 L4 20 C7 19 10 19 12 20 Z" fill="currentColor"/>
  <!-- Open book right page -->
  <path d="M12 5 C14 4 17 4 20 5 L20 20 C17 19 14 19 12 20 Z" fill="currentColor"/>
  <!-- Spine -->
  <rect x="11.5" y="5" width="1" height="15" fill="#D97706"/>
  <!-- Lines left page -->
  <line x1="5.5" y1="9" x2="10.5" y2="8.5" stroke="#D97706" stroke-width="1" stroke-linecap="round"/>
  <line x1="5.5" y1="12" x2="10.5" y2="11.5" stroke="#D97706" stroke-width="1" stroke-linecap="round"/>
  <line x1="5.5" y1="15" x2="10.5" y2="14.5" stroke="#D97706" stroke-width="1" stroke-linecap="round"/>
  </symbol>

  <symbol id="icon-moving" viewBox="0 0 24 24">

  <!-- Box body -->
  <rect x="2" y="10" width="20" height="13" rx="2" fill="currentColor"/>
  <!-- Top flap left -->
  <path d="M2 10 L2 5 L12 7 L12 10 Z" fill="currentColor"/>
  <!-- Top flap right -->
  <path d="M22 10 L22 5 L12 7 L12 10 Z" fill="currentColor"/>
  <!-- Tape vertical -->
  <rect x="11" y="7" width="2" height="16" fill="#D97706"/>
  <!-- Tape horizontal -->
  <rect x="2" y="15" width="20" height="2" fill="#D97706"/>
  </symbol>

  <symbol id="icon-beauty" viewBox="0 0 24 24">

  <!-- Scissors ring left -->
  <circle cx="7" cy="6" r="4" fill="currentColor"/>
  <circle cx="7" cy="6" r="2.2" fill="#D97706"/>
  <circle cx="7" cy="6" r="1" fill="currentColor"/>
  <!-- Scissors ring right -->
  <circle cx="17" cy="6" r="4" fill="currentColor"/>
  <circle cx="17" cy="6" r="2.2" fill="#D97706"/>
  <circle cx="17" cy="6" r="1" fill="currentColor"/>
  <!-- Blade 1 -->
  <path d="M9.5 8.5 L15.5 19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Blade 2 -->
  <path d="M14.5 8.5 L8.5 19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Pivot -->
  <circle cx="12" cy="14" r="1.8" fill="#D97706"/>
  <!-- Lower handle wedge -->
  <path d="M15.5 19 L14 24 L10 24 L8.5 19 L12 21 Z" fill="currentColor"/>
  </symbol>

  <symbol id="icon-repairs" viewBox="0 0 24 24">

  <!-- Hammer head -->
  <rect x="7" y="2" width="14" height="7" rx="2" fill="currentColor"/>
  <!-- Claw left -->
  <path d="M7 3.5 L3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M7 8 L3 9.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Face accent -->
  <rect x="17" y="2" width="4" height="7" rx="0 2 2 0" fill="#D97706"/>
  <!-- Handle -->
  <rect x="12" y="8" width="3.5" height="16" rx="1.75" fill="currentColor"/>
  <!-- Grip -->
  <rect x="11.75" y="18" width="4" height="5" rx="1.75" fill="#D97706"/>
  </symbol>

  <symbol id="icon-gardening" viewBox="0 0 24 24">

  <!-- Leaf -->
  <path d="M12 1 C17 3 21 8 21 14 C21 19 17 23 12 24 C7 23 3 19 3 14 C3 8 7 3 12 1 Z" fill="currentColor"/>
  <!-- Center vein -->
  <line x1="12" y1="3" x2="12" y2="22" stroke="#D97706" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Left veins -->
  <path d="M12 8 Q8 10 5 12" stroke="#D97706" stroke-width="0.9" fill="none" stroke-linecap="round"/>
  <path d="M12 13 Q7 15 5 18" stroke="#D97706" stroke-width="0.9" fill="none" stroke-linecap="round"/>
  <!-- Right veins -->
  <path d="M12 8 Q16 10 19 12" stroke="#D97706" stroke-width="0.9" fill="none" stroke-linecap="round"/>
  <path d="M12 13 Q17 15 19 18" stroke="#D97706" stroke-width="0.9" fill="none" stroke-linecap="round"/>
  </symbol>
</svg>