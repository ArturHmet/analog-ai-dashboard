<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Dashboard — ProHelp</title>
  <meta name="description" content="Manage your tasks, orders, and account on ProHelp.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://prohelp.work/dashboard.html">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://prohelp.work/dashboard.html">
  <meta property="og:title" content="My Dashboard — ProHelp">
  <meta property="og:description" content="Manage your tasks, orders, and account on ProHelp.">
  <meta property="og:image" content="https://prohelp.work/og-image.jpg">
  <meta property="og:site_name" content="ProHelp">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="My Dashboard — ProHelp">

<link rel="icon" type="image/png" href="/assets/prohelp-favicon.png">
<link rel="apple-touch-icon" href="/assets/prohelp-favicon.png">
<link rel="stylesheet" href="/shared.css"><!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-PROHELP001"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag("js",new Date());gtag("config","G-PROHELP001");</script>
</head>
<body>
<script>window._PG='';</script>
<header class="site-header" id="sh"></header>

<div class="page-hdr">
<div class="con">
  <div class="page-bc"><a href="/">Home</a><span>/</span><span>My Dashboard</span></div>
  <h1 class="page-title" id="dname3">Client Dashboard</h1>
  <p class="page-sub">Manage your tasks and track offers</p>
</div></div>
<main class="con">
<div class="dash-wrap">
  <div class="dash-nav">
    <button class="dash-nav-item on" onclick="dSw('tasks',this)">📋 My Tasks</button>
    <button class="dash-nav-item" onclick="dSw('post',this)">➕ Post Task</button>
    <button class="dash-nav-item" onclick="dSw('profile',this)">👤 Profile</button>
    <button class="dash-nav-item" onclick="Auth.clear();location.href='/'">← Logout</button>
  </div>
  <div>
    <div class="dash-sec on" id="ds-tasks">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <h2 style="font-size:1.2rem;font-weight:800">My Tasks</h2>
        <button class="btn btn-gold btn-sm" onclick="dSw('post',document.querySelectorAll('.dash-nav-item')[1])">+ New Task</button>
      </div>
      <div id="my-tasks2" class="sp"><div class="spinner"></div></div>
    </div>
    <div class="dash-sec" id="ds-post">
      <h2 style="font-size:1.2rem;font-weight:800;margin-bottom:20px">Post a New Task</h2>
      <div class="card" style="max-width:600px">
        <div class="fi"><label class="fl">Task title *</label><input id="dtt" class="fi2" placeholder="e.g. Fix leaking tap in kitchen"></div>
        <div class="fi"><label class="fl">Category *</label><select id="dtc" class="fi2"><option value="">Select category</option></select></div>
        <div class="fi"><label class="fl">Description</label><textarea id="dtd" class="fi2" rows="4" placeholder="More details about the task..."></textarea></div>
        <div class="frow">
          <div class="fi"><label class="fl">Budget (€) *</label><input id="dtb" class="fi2" type="number" min="5" placeholder="50"></div>
          <div class="fi"><label class="fl">Location *</label><input id="dtl" class="fi2" placeholder="e.g. Valletta"></div>
        </div>
        <button class="btn btn-gold btn-full" onclick="postDash()">Post Task — Get Free Offers →</button>
      </div>
    </div>
    <div class="dash-sec" id="ds-profile">
      <h2 style="font-size:1.2rem;font-weight:800;margin-bottom:20px">My Profile</h2>
      <div class="card" style="max-width:500px" id="d-prof">Loading...</div>
    </div>
  </div>
</div>
</main>
<div id="fc2"></div>
<script src="/shared.js"></script>
<script>

const DU=Auth.get();
if(!DU||DU.role!=='client'){location.href='/login.html?next=/dashboard-client.html';}
else{document.getElementById('dname3').textContent='Hello, '+DU.name.split(' ')[0]+'! 👋';}
CATS.forEach(c=>{document.getElementById('dtc').innerHTML+=`<option value="${c.id}">${c.icon} ${c.name}</option>`;});
function dSw(sec,btn){
  document.querySelectorAll('.dash-sec').forEach(s=>s.classList.remove('on'));
  document.querySelectorAll('.dash-nav-item').forEach(b=>b.classList.remove('on'));
  document.getElementById('ds-'+sec).classList.add('on');btn.classList.add('on');
  if(sec==='tasks')loadMyTasks();
  if(sec==='profile')loadClientProfile();
}
async function loadMyTasks(){
  const el=document.getElementById('my-tasks2');
  el.innerHTML='<div class="sp"><div class="spinner"></div></div>';
  try{
    const orders=await API.get('/orders?limit=200');
    const mine=orders.filter(o=>o.client_id===DU.id||o.client_name===DU.name);
    if(!mine.length){
      el.innerHTML='<div class="empty-state"><div class="empty-icon">📋</div><p>No tasks yet.<br><button class="btn btn-gold btn-sm" onclick="dSw(\'post\',document.querySelectorAll(\'.dash-nav-item\')[1])">Post your first task</button></p></div>';
      return;
    }
    let h='<div style="display:flex;flex-direction:column;gap:12px">';
    mine.forEach(t=>{
      h+=`<div class="tk" onclick="location.href='/task.html?id=${t.id}'">
        <div class="tk-head"><div class="tk-title">${esc(t.title)}</div><div class="tk-price">${fmtPrice(t.budget)}</div></div>
        <div class="tk-meta">
          <span class="bdg bdg-blue">${catIcon(t.category)} ${catName(t.category)}</span>
          <span class="bdg bdg-muted">📍 ${esc(t.location||'Remote')}</span>
          <span class="bdg ${t.status==='open'?'bdg-gr':'bdg-muted'}">${t.status}</span>
          <span class="bdg bdg-or">${t.applications||0} offers</span>
        </div>
        <div class="tk-foot"><span></span><span class="tk-time">Posted ${timeAgo(t.created_at)}</span></div>
      </div>`;
    });
    el.innerHTML=h+'</div>';
  }catch(e){el.innerHTML='<div class="empty-state"><p style="color:var(--rd)">'+esc(e.message)+'</p></div>';}
}
async function postDash(){
  const title=document.getElementById('dtt').value.trim();
  const cat=document.getElementById('dtc').value;
  const desc=document.getElementById('dtd').value.trim();
  const budget=parseFloat(document.getElementById('dtb').value);
  const loc=document.getElementById('dtl').value.trim();
  if(!title||!cat||!(budget>=5)||!loc){toast('Fill in all required fields','err');return;}
  try{
    const r=await API.post('/orders',{client_id:DU.id,title,description:desc,category:cat,budget,location:loc});
    toast('Task posted! 🎉','ok');setTimeout(()=>location.href='/task.html?id='+r.id,1200);
  }catch(e){toast(esc(e.message),'err');}
}
function loadClientProfile(){
  const el=document.getElementById('d-prof');
  el.innerHTML=`<div style="display:flex;align-items:center;gap:16px;margin-bottom:20px">
    <div class="av av-lg">${DU.name[0]}</div>
    <div><div style="font-size:1.2rem;font-weight:800">${esc(DU.name)}</div>
      <div style="color:var(--tx2);font-size:.875rem">${esc(DU.email)}</div>
      <span class="bdg bdg-gr" style="margin-top:6px;display:inline-flex">Client Account</span></div></div>
  <p style="color:var(--tx2);font-size:.875rem">Manage your tasks and hire trusted professionals worldwide.</p>`;
}
loadMyTasks();

</script>
<script src="/chatbot.js"></script>


</body></html>
